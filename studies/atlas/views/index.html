<!doctype html>
<meta charset="utf-8">
<title>atlas — transcripts</title>
<link rel="stylesheet" href="atlas.css">
<style>
  .reads { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:var(--soft); }
  .card.hl { outline:2px solid var(--acc); }
  .card h3 { margin:0 0 6px; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .card h3 span { color:var(--mut); font-weight:400; }
  .card pre { white-space:pre-wrap; font:12.5px/1.4 inherit; margin:0; max-height:70vh; overflow:auto; }
  .prompt { margin:0 0 14px; padding:10px 12px; border-left:3px solid var(--acc); background:var(--soft); white-space:pre-wrap; }
  .len { color:#b54; font-weight:600; }
</style>
<header>
  <a href="site/index.html">← atlas</a>
  <b>transcripts · <span id="ver"></span></b>
  <span id="ctl"></span>
</header>
<main id="main"></main>
<script src="data.js"></script>
<script>
const A = window.ATLAS, M = A.models, AN = A.anchors, D = A.data;
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1 = x => x.toFixed(x < 10 ? 2 : 1);
const P = new URLSearchParams(location.search);
const state = { model: M.includes(P.get('model')) ? P.get('model') : M[0],
                anchor: AN.some(a => a.id === P.get('anchor')) ? P.get('anchor') : AN[0].id,
                mode: P.get('model') && !P.get('anchor') ? 'model' : 'anchor', sample: P.get('sample') || 'all' };
const sampleOptions = [...Array(A.n).keys()].map(String).concat('all');

function cards(m, aid, title, sub) {
  const c = D[m]?.cells?.[aid]; if (!c) return '';
  return c.samples
    .map((s, i) => [s, i]).filter(([s, i]) => state.sample === 'all' || String(i) === state.sample)
    .map(([s, i]) => `<div class="card${m === P.get('model') ? ' hl' : ''}"><h3>${title} #${i}<span>${s.words}w · ${f1(s.out ? s.reason / s.out : 0)}${s.finish !== 'stop' ? ` · <span class="len">${s.finish}</span>` : ''}</span></h3>${sub ? `<div class="mut" style="margin-bottom:6px">${esc(sub)}</div>` : ''}<pre>${esc(s.reply || ('ERROR: ' + s.error))}</pre></div>`).join('');
}
function read() {
  if (state.mode === 'anchor') {
    const a = AN.find(x => x.id === state.anchor);
    return `<div class="prompt"><b>${a.id}</b> · ${esc(a.text)}</div><div class="reads">${M.map(m => cards(m, a.id, A.short[m])).join('')}</div>`;
  }
  return `<div class="prompt"><b>${A.short[state.model]}</b> · every anchor</div><div class="reads">${AN.map(x => cards(state.model, x.id, x.id, x.text)).join('')}</div>`;
}
function controls() {
  const opt = (arr, cur, label = x => x) => arr.map(x => `<option value="${x}" ${x === cur ? 'selected' : ''}>${label(x)}</option>`).join('');
  return `<select id="mode">${opt(['anchor', 'model'], state.mode, x => x === 'anchor' ? 'one anchor, all models' : 'one model, all anchors')}</select>
    <select id="sample">${opt(sampleOptions, state.sample, x => 'sample ' + x)}</select>
    ${state.mode === 'anchor' ? `<select id="anchor">${opt(AN.map(a => a.id), state.anchor)}</select>` : `<select id="model">${opt(M, state.model, m => A.short[m])}</select>`}`;
}
function render() {
  document.getElementById('ver').textContent = A.spec_version;
  document.getElementById('ctl').innerHTML = controls();
  document.getElementById('main').innerHTML = read();
  for (const k of ['mode', 'anchor', 'model', 'sample']) { const el = document.getElementById(k); if (el) el.onchange = e => { state[k] = e.target.value; render(); }; }
}
render();
</script>
