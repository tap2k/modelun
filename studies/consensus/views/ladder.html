<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand ladder</title>
<link rel="stylesheet" href="base.css">
<style>
  :root{
    color-scheme:dark;
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a; --fg:#e6e8ee; --mut:#9aa3b2; --acc:#6ea8fe;
    /* categorical slots, dark steps (validated: dataviz validate_palette.js --mode dark, all checks pass) */
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
    --other:#454b58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,Menlo,monospace}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:6}
  header h1{font-size:15px;margin:0;font-weight:650} header .sub{color:var(--mut);font-size:12px}
  nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:var(--mut);padding:6px 12px;border-radius:7px;font-size:13px;border:1px solid transparent}
  nav a:hover{color:var(--fg);background:var(--panel2);text-decoration:none}
  nav a.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
  main{padding:20px 22px;max-width:none}        /* full window width (base.css caps main at 1180px): nine columns */
  .note{color:var(--mut);font-size:12.5px;margin:0 0 16px;max-width:92ch} .note b{color:var(--fg)}
  h2{font-size:19px;margin:0 0 10px} h3{margin:24px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-size:11.5px}
  .crumb{font-size:12.5px;margin:0 0 14px}
  .twrap{overflow-x:auto;max-width:100%}
  table.t{border-collapse:collapse;font-size:13px}
  table.t th,table.t td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  table.t th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;vertical-align:bottom}
  table.m td.n{width:62px;text-align:center;border:1px solid var(--bg)} table.m td.clamp{outline:2px solid var(--fg);outline-offset:-2px}
  table.m td.n small{display:block;color:var(--mut);font-size:10.5px} table.m td.dg{color:var(--mut)}
  td.b.cellr{cursor:pointer} td.b.cellr:hover{background:var(--panel2)} th.gap,td.gap{border-left:2px solid var(--line)}
  table.t td.n{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right}
  table.t tr.row{cursor:pointer} table.t tr.row:hover td{background:var(--panel)}
  /* a cell naming a brand: a swatch carries the brand's color, the text stays in text ink */
  td.b{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;max-width:128px;overflow:hidden;text-overflow:ellipsis}
  td.b .sw{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px;background:var(--other)}
  td.b .sh{color:var(--mut);margin-left:6px}
  td.b.same{color:var(--mut)} td.b.np{color:var(--mut);font-style:italic}
  td.b.moved{font-weight:650}
  /* the stacked share bar of one level */
  .lvl{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:0 0 10px}
  .lvl .lab{font-size:13px} .lvl .lab small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
  .bar{display:flex;gap:2px;height:30px}
  .bar i{display:flex;align-items:center;min-width:0;overflow:hidden;font-style:normal;font-size:11.5px;color:#fff;padding:0 6px;white-space:nowrap}
  .bar i:first-child{border-radius:4px 0 0 4px} .bar i:last-child{border-radius:0 4px 4px 0}
  .bar i.np{background:repeating-linear-gradient(135deg,var(--panel2) 0 4px,var(--panel) 4px 8px);color:var(--mut)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:10px;height:10px;border-radius:2px}
  .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:12px}
  .ctl a{color:var(--mut);border:1px solid var(--line);border-radius:7px;padding:3px 10px}
  .ctl a.on{color:var(--fg);border-color:var(--mut);background:var(--panel2)} .ctl a:hover{text-decoration:none;color:var(--fg)}
  #tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;font-size:12px;z-index:10;display:none;max-width:320px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  @media (max-width:640px){ main{padding:16px} header .sub{display:none} .lvl{grid-template-columns:1fr;gap:4px} }
</style>
</head>
<body>
<header>
  <h1>brand ladder <span class="sub">— each verb clamped and free, model by model</span></h1>
  <nav id="nav">
    <a href="#" data-v="">clamp</a>
    <a href="#about" data-v="about">method</a>
    <a href="index.html?set=brands">brand battery</a>
  </nav>
</header>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
<script src="data_ladder.js"></script>
<script>
const L = window.LADDER;
const main = document.getElementById('main'), tip = document.getElementById('tip');
if (!L) { main.textContent = 'No data. Run: python3 views/build.py --ladder'; throw new Error('no data_ladder.js'); }
const NP = L.no_pick, LV = L.levels, NAME = LV[0].id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => (x*100).toFixed(0) + '%';
const label = c => c.replace(/_/g, ' ');

const modal = xs => { const k = {}; xs.forEach(x => k[x] = (k[x] || 0) + 1);
  const e = Object.entries(k).sort((a, b) => b[1] - a[1]); return e.length ? {a: e[0][0], n: e[0][1], of: xs.length} : null; };
function tipAt(e, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
}
function hover(sel, html) {
  main.querySelectorAll(sel).forEach(el => {
    el.addEventListener('mousemove', e => tipAt(e, html(el)));
    el.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}

/* The seven steps: each verb clamped to a name and then asked freely, side by side, and the two-turn pick.
   A model's answer at a step is its most common brand over the runs, for each category. */
const STEPS = ["name", "free_name", "choose", "free_choose", "recommend_clamp", "recommend", "pick2"];
const CLAMP = {free_name: "name", free_choose: "choose", recommend: "recommend_clamp"};   // free step -> same verb clamped
const SHORT = {name: "Name", choose: "Choose", recommend_clamp: "Recommend", free_name: "Name", free_choose: "Choose",
               recommend: "Recommend", pick2: "two-turn pick"};
const GAP = lv => ["choose", "recommend_clamp", "pick2"].includes(lv) ? " gap" : "";
const GROUP = lv => lv === "pick2" ? "" : lv in CLAMP ? "free" : "clamped";
const head = lv => `${GROUP(lv) ? `<small style="display:block;color:var(--mut);font-weight:400">${GROUP(lv)}</small>` : ""}${SHORT[lv]}`;
const prompt = lv => LV.find(v => v.id === lv).prompt;
const named = xs => (xs || []).filter(x => x !== NP);
const ans = (m, c, lv) => { const xs = named(((L.per_model[m] || {})[c] || {})[lv]); return xs.length ? modal(xs).a : null; };

// agreement of two steps over (model, category) pairs where both name a brand
function agree(ms, a, b) {
  let same = 0, n = 0;
  for (const m of ms) for (const c of L.cats) {
    const x = ans(m, c, a), y = ans(m, c, b);
    if (x && y) { n++; same += x === y; }
  }
  return n ? {v: same / n, n} : null;
}
// for a free step: share of (model, category) pairs whose free replies mostly mention the clamped answer, and name no brand
// each free reply against the model's clamped brand for the same verb: the brand it names first, a brand it names anywhere
// in the list (first included), or no brand from the pool at all
function fate(ms, lv) {
  let first = 0, later = 0, none = 0, n = 0;
  for (const m of ms) for (const c of L.cats) {
    const d = ans(m, c, CLAMP[lv]); if (!d) continue;
    for (const l of (((L.lists || {})[m] || {})[c] || {})[lv] || []) {
      n++; if (!l.length) none++; else { first += l[0] === d; later += l.includes(d); }
    }
  }
  return n ? {first: first / n, later: later / n, none: none / n, n} : null;
}
const shade = v => `background:rgba(57,135,229,${(0.06 + 0.85 * v).toFixed(2)})`;
const FREE = ["free_name", "free_choose", "recommend"];
const COLS = [["first", "first"], ["later", "in the list"], ["none", "no brand"]];
function fateCells(ms) {
  return FREE.map(f => { const r = fate(ms, f);
    return COLS.map(([k], i) => r == null ? `<td class="n${i ? "" : " gap"}">–</td>`
      : `<td class="n${i ? "" : " gap"}" style="${k === "none" ? "" : shade(r[k])}">${pct(r[k])}</td>`).join(""); }).join("");
}
function home() {
  const ms = L.models;
  let h = `<h2>the clamp: each verb asked freely, against the same verb clamped</h2>
  <p class="note">The free question drops "Reply with the name only." and nothing else. For every free reply, where is the brand
  the model gives to the clamped question? <b>First</b>: the reply leads with it. <b>In the list</b>: the reply names it anywhere,
  first included. <b>No brand</b>: the reply names no brand at all.
  The clamped brand is the model's most common answer over 8 runs; each free step has 4 runs per category, ${L.cats.length}
  categories. Click a model for its ladder.</p>
  <div class="twrap"><table class="t"><tr><th rowspan="2">model</th>${FREE.map(f => `<th colspan="3" class="gap" style="text-align:center">${SHORT[f]}</th>`).join("")}</tr>
  <tr>${FREE.map(() => COLS.map(([, l], i) => `<th class="${i ? "" : "gap"}">${l}</th>`).join("")).join("")}</tr>
  <tr><td><b>all ${ms.length} models</b></td>${fateCells(ms)}</tr>`;
  const rows = ms.map(m => ({m, f: FREE.map(f => fate([m], f))}));
  const mean = r => { const v = r.filter(Boolean); return v.length ? v.reduce((a, x) => a + x.first, 0) / v.length : 2; };
  rows.sort((x, y) => mean(x.f) - mean(y.f));
  for (const {m} of rows) h += `<tr class="row" data-m="${esc(m)}"><td class="mono">${esc(m)}</td>${fateCells([m])}</tr>`;
  main.innerHTML = h + "</table></div>";
  main.querySelectorAll("tr.row").forEach(r => r.addEventListener("click", () => location.hash = "#m/" + encodeURIComponent(r.dataset.m)));
}

const ROWCOL = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
function model(m) {
  const rows = L.cats.map(c => { const a = STEPS.map(lv => ans(m, c, lv)), seen = [];
    a.forEach(x => { if (x && !seen.includes(x)) seen.push(x); }); return {c, a, seen}; }).filter(r => r.seen.length);
  rows.sort((x, y) => y.seen.length - x.seen.length || x.c.localeCompare(y.c));
  let h = `<p class="crumb"><a href="#">clamp</a> / <span class="mono">${esc(m)}</span></p>
  <h2 class="mono">${esc(m)}</h2>
  <p class="note">Within a row, one colour is one brand, so a run of the same colour is the same answer carried across steps.
  Categories with the most different brands are first. Hover a cell for every run: a clamped step's answers, or the brands each free reply names, in order. Click a category to read all its replies in order, or a cell for one step.</p>
  <div class="twrap"><table class="t"><tr><th>category</th>${STEPS.map(lv =>
    `<th class="${GAP(lv)}" title="${esc(prompt(lv))}">${head(lv)}</th>`).join("")}</tr>`;
  for (const r of rows) h += `<tr><td><a href="#" class="seq" data-c="${esc(r.c)}">${esc(label(r.c))}</a></td>` + r.a.map((x, i) => {
    const g = GAP(STEPS[i]);
    return x == null ? `<td class="b np cellr${g}" data-c="${esc(r.c)}" data-l="${STEPS[i]}">no brand</td>`
      : `<td class="b cellr${g}" data-c="${esc(r.c)}" data-l="${STEPS[i]}" title="${esc(x)}"><span class="sw" style="background:${ROWCOL[r.seen.indexOf(x)] || "var(--other)"}"></span>${esc(x)}</td>`;
  }).join("") + "</tr>";
  main.innerHTML = h + `</table></div><div id="reader"></div>`;
  hover("td.cellr", td => runsTip(m, td.dataset.c, td.dataset.l));
  main.querySelectorAll("a.seq").forEach(a => a.addEventListener("click", e => { e.preventDefault(); readReplies(m, a.dataset.c, STEPS); }));
  main.querySelectorAll("td.cellr").forEach(td => td.addEventListener("click", () => readReplies(m, td.dataset.c, td.dataset.l)));
}

function runsTip(m, c, lv) {
  const xs = ((L.per_model[m] || {})[c] || {})[lv] || [], ls = (((L.lists || {})[m] || {})[c] || {})[lv];
  const ref = CLAMP[lv] ? ans(m, c, CLAMP[lv]) : lv === "pick2" ? ans(m, c, "name") : null;
  const b = x => x === ref ? `<b style="color:var(--s1)">${esc(x)}</b>` : esc(x);
  let h = `<div style="color:var(--mut);margin:0 0 4px">${GROUP(lv) ? GROUP(lv) + " " : ""}${SHORT[lv]} · ${xs.length} runs</div>`;
  if (CLAMP[lv] && ls && ls.length) {
    h += ls.map((l, i) => `<div>${i + 1}. ${l.length ? l.map(b).join(", ") : "<i>no brand from the pool</i>"}</div>`).join("");
    if (ref) h += `<div style="color:var(--mut);margin-top:4px"><b style="color:var(--s1)">${esc(ref)}</b> = its ${CLAMP[lv] ? SHORT[CLAMP[lv]] : "Name"} clamped brand</div>`;
  } else {
    const k = {}; xs.forEach(x => k[x] = (k[x] || 0) + 1);
    h += Object.entries(k).sort((a, b2) => b2[1] - a[1]).map(([a, n]) => `<div>${a === NP ? "<i>no brand</i>" : esc(a)} ×${n}</div>`).join("");
  }
  return h;
}

function about() {
  const t = L.two_turn;
  main.innerHTML = `<h2>method</h2>
  <p class="note"><b>Steps.</b> ${STEPS.map(lv => `<b>${SHORT[lv]}${GROUP(lv) ? " " + GROUP(lv) : ""}</b>: “${esc(prompt(lv))}”`).join("; ")}.
  Every model is as served.</p>
  <p class="note"><b>Scoring a free reply.</b> Free Name and free Recommend take the first brand from the clamped answer pools
  that the reply mentions. Free Choose and the two-turn pick take the brand the reply commits to. A clamped reply is the brand.</p>
  <p class="note"><b>Two-turn pick.</b> Of ${t.n} replies with a pick, the model's own Name brand was in its turn-1 list
  ${pct(t.default_in_list)} of the time and was the pick ${pct(t.default_picked)}; the pick was the first brand listed
  ${pct(t.first_listed)}.</p>
  <p class="note">Source: <code>studies/consensus/brand_ladder.py</code>, built by <code>views/build.py --ladder</code>.</p>`;
}

function loadReplies(c, then) {
  window.LADDER_R = window.LADDER_R || {};
  if (window.LADDER_R[c]) return then();
  const sc = document.createElement("script");
  sc.src = "ladder_replies/" + encodeURIComponent(c) + ".js";
  sc.onload = then;
  sc.onerror = () => { document.getElementById("reader").innerHTML = '<p class="note">No reply file; run views/build.py --ladder.</p>'; };
  document.head.appendChild(sc);
}
function mark(text, own, ans) {
  let t = esc(text);
  const hi = (b, col) => { if (!b) return; const re = new RegExp("\\b(" + b.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "gi");
    t = t.replace(re, `<b style="background:${col};color:#fff;border-radius:3px;padding:0 3px">$1</b>`); };
  hi(own, "var(--s1)");
  if (ans && ans !== own) hi(ans, "var(--s2)");
  return t;
}
// the replies of one step, or of every step in order when lvs is the whole sequence
function readReplies(m, c, lvs) {
  if (!Array.isArray(lvs)) lvs = [lvs];
  const box = document.getElementById("reader");
  box.innerHTML = '<p class="note">loading…</p>';
  loadReplies(c, () => {
    const tag = (x, col) => `<span style="background:${col};color:#fff;border-radius:3px;padding:0 4px">${esc(x)}</span>`;
    let h = lvs.length > 1 ? `<h2 style="margin-top:22px" class="mono">${esc(m)} · ${esc(label(c))}</h2>
      <p class="note">Every step in order. In each, blue marks the brand it is read against (the clamped Name brand, or the same
      verb clamped for a free step) and orange the brand the step gives instead.</p>` : "";
    for (const lv of lvs) {
      const runs = ((window.LADDER_R[c] || {})[m] || {})[lv] || [];
      const ref = CLAMP[lv] || "name", own = ans(m, c, ref), here = ans(m, c, lv);
      const groups = new Map();
      for (const run of runs) { const k = JSON.stringify(run.map(x => x.r)); groups.set(k, {run, n: (groups.get(k) || {n: 0}).n + 1}); }
      h += `<h3 style="margin-top:18px">${lvs.length > 1 ? "" : esc(m) + " · " + esc(label(c)) + " · "}${GROUP(lv) ? GROUP(lv) + " " : ""}${SHORT[lv]}</h3>
        <p class="note">${own ? tag(own, "var(--s1)") + ` is its ${SHORT[ref]} clamped brand` : `no ${SHORT[ref]} clamped brand`};
        ${lv === ref ? "" : here && here !== own ? tag(here, "var(--s2)") + " is what it gives here." : here ? "here it gives the same." : "here it names no brand."}
        ${runs.length} runs.</p>`;
      for (const {run, n} of groups.values()) {
        h += `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;background:var(--panel)">`
          + (n > 1 ? `<div class="note" style="margin:0 0 6px">×${n} identical runs</div>` : "")
          + run.map((cell, i) => `<div style="margin:${i ? "10px" : "0"} 0 0"><div class="mono" style="color:var(--mut);font-size:12px">${esc(cell.u)}</div>
             <div style="white-space:pre-wrap;font-size:13px;line-height:1.5">${cell.r == null ? "<i>failed run</i>" : mark(cell.r, own, here)}</div></div>`).join("")
          + `</div>`;
      }
    }
    box.innerHTML = h;
    box.scrollIntoView({behavior: "smooth", block: "start"});
  });
}

/* ---------- router ---------- */
function route() {
  const [v, arg] = (location.hash || '#').slice(1).split('/');
  tip.style.display = 'none';
  document.querySelectorAll('nav a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === (v === 'm' ? '' : v)));
  if (v === 'm' && arg) model(decodeURIComponent(arg));
  else if (v === 'about') about();
  else home();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
