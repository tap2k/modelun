<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand ladder</title>
<link rel="stylesheet" href="base.css">
<style>
  :root{
    color-scheme:dark;
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a; --fg:#e6e8ee; --mut:#9aa3b2; --acc:#6ea8fe;
    /* categorical slots, dark steps (validated: dataviz validate_palette.js --mode dark, all checks pass) */
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
    --other:#454b58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,Menlo,monospace}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:6}
  header h1{font-size:15px;margin:0;font-weight:650} header .sub{color:var(--mut);font-size:12px}
  nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:var(--mut);padding:6px 12px;border-radius:7px;font-size:13px;border:1px solid transparent}
  nav a:hover{color:var(--fg);background:var(--panel2);text-decoration:none}
  nav a.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
  main{padding:20px 22px;max-width:none}        /* full window width (base.css caps main at 1180px): nine columns */
  .note{color:var(--mut);font-size:12.5px;margin:0 0 16px;max-width:92ch} .note b{color:var(--fg)}
  h2{font-size:19px;margin:0 0 10px} h3{margin:24px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-size:11.5px}
  .crumb{font-size:12.5px;margin:0 0 14px}
  .twrap{overflow-x:auto;max-width:100%}
  table.t{border-collapse:collapse;font-size:13px}
  table.t th,table.t td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  table.t th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;vertical-align:bottom}
  table.t th{cursor:help}
  table.t td.n{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right}
  table.t tr.row{cursor:pointer} table.t tr.row:hover td{background:var(--panel)}
  /* a cell naming a brand: a swatch carries the brand's color, the text stays in text ink */
  td.b{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;max-width:128px;overflow:hidden;text-overflow:ellipsis}
  td.b .sw{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px;background:var(--other)}
  td.b .sh{color:var(--mut);margin-left:6px}
  td.b.same{color:var(--mut)} td.b.np{color:var(--mut);font-style:italic}
  td.b.moved{font-weight:650}
  /* the stacked share bar of one level */
  .lvl{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:0 0 10px}
  .lvl .lab{font-size:13px} .lvl .lab small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
  .bar{display:flex;gap:2px;height:30px}
  .bar i{display:flex;align-items:center;min-width:0;overflow:hidden;font-style:normal;font-size:11.5px;color:#fff;padding:0 6px;white-space:nowrap}
  .bar i:first-child{border-radius:4px 0 0 4px} .bar i:last-child{border-radius:0 4px 4px 0}
  .bar i.np{background:repeating-linear-gradient(135deg,var(--panel2) 0 4px,var(--panel) 4px 8px);color:var(--mut)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:10px;height:10px;border-radius:2px}
  .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:12px}
  .ctl a{color:var(--mut);border:1px solid var(--line);border-radius:7px;padding:3px 10px}
  .ctl a.on{color:var(--fg);border-color:var(--mut);background:var(--panel2)} .ctl a:hover{text-decoration:none;color:var(--fg)}
  #tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;font-size:12px;z-index:10;display:none;max-width:320px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  @media (max-width:640px){ main{padding:16px} header .sub{display:none} .lvl{grid-template-columns:1fr;gap:4px} }
</style>
</head>
<body>
<header>
  <h1>brand ladder <span class="sub">— does a model's one-word brand survive a real conversation?</span></h1>
  <nav id="nav">
    <a href="#overview" data-v="overview">categories</a>
    <a href="#models" data-v="models">models</a>
    <a href="#about" data-v="about">method</a>
    <a href="index.html?set=brands">brand battery</a>
  </nav>
</header>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
<script src="data_ladder.js"></script>
<script>
const L = window.LADDER;
const main = document.getElementById('main'), tip = document.getElementById('tip');
if (!L) { main.textContent = 'No data. Run: python3 views/build.py --ladder'; throw new Error('no data_ladder.js'); }
const NP = L.no_pick, LV = L.levels, NAME = LV[0].id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => (x*100).toFixed(0) + '%';
const label = c => c.replace(/_/g, ' ');
const SLOTS = 6;

/* per category: the field's top brand and share at each level, and a fixed brand -> color slot
   (brands ranked by share pooled over all levels, so a brand keeps its color down the ladder) */
const TOP = {}, SLOT = {};
for (const c of L.cats) {
  TOP[c] = {}; const pooled = {};
  for (const lv of LV) {
    const d = L.dist[c][lv.id].filter(([a]) => a !== NP), tot = d.reduce((s, [, n]) => s + n, 0);
    TOP[c][lv.id] = d.length ? {a: d[0][0], share: d[0][1] / tot} : null;
    for (const [a, n] of d) pooled[a] = (pooled[a] || 0) + n / tot;
  }
  SLOT[c] = {};
  Object.entries(pooled).sort((x, y) => y[1] - x[1]).slice(0, SLOTS).forEach(([a], i) => SLOT[c][a] = i + 1);
}
const color = (c, a) => SLOT[c][a] ? `var(--s${SLOT[c][a]})` : 'var(--other)';
const moves = c => LV.filter(lv => TOP[c][lv.id] && TOP[c][lv.id].a !== TOP[c][NAME].a).length;
const modal = xs => { const k = {}; xs.forEach(x => k[x] = (k[x] || 0) + 1);
  const e = Object.entries(k).sort((a, b) => b[1] - a[1]); return e.length ? {a: e[0][0], n: e[0][1], of: xs.length} : null; };

function tipAt(e, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
}
function hover(sel, html) {
  main.querySelectorAll(sel).forEach(el => {
    el.addEventListener('mousemove', e => tipAt(e, html(el)));
    el.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}
// column heads: each level's question, about a soda brand, or about category c on that category's pages
// the question itself is the column's tooltip, so nine columns fit across the window
const lvHead = c => LV.map(lv => `<th title="${esc(c ? lv.prompt.replace(/soda brand/g, label(c)) : lv.prompt)}">${esc(lv.label)}</th>`).join('');

/* ---------- overview: the level summary and every category's walk ---------- */
function overview() {
  let h = `<h2>categories</h2>
  <p class="note">The ${L.cats.length} brand questions asked ${LV.length} ways, each verb with a one-name instruction and without, from a one-word <b>Name</b> to a two-turn conversation
  (recommend, then <b>“Which one would you pick?”</b>), to the same ${LV[0].models} models, every model as served.
  Each cell is the field's most common brand at that level and its share. <b>Bold</b> marks a level whose top
  brand differs from Name's. Categories that move most are first; click one for its full walk.</p>
  <div class="twrap"><table class="t"><tr><th></th>${lvHead()}</tr>
  <tr><td>top brand differs from Name</td>${LV.map(lv => `<td class="n">${lv.flips} / ${L.cats.length}</td>`).join('')}</tr>
  <tr><td title="mean share of the most common brand">mean top share</td>${LV.map(lv => `<td class="n">${pct(lv.top_share)}</td>`).join('')}</tr>
  <tr><td title="how often a model's answer equals its own most frequent one-word Name answer">own Name default kept</td>${LV.map(lv => `<td class="n">${pct(lv.retention)}</td>`).join('')}</tr>
  <tr><td title="replies naming no brand">no brand named</td>${LV.map(lv => `<td class="n">${pct(lv.no_pick)}</td>`).join('')}</tr>
  </table></div>
  <h3>by category</h3>
  <div class="twrap"><table class="t"><tr><th>category</th>${lvHead()}</tr>`;
  for (const c of [...L.cats].sort((x, y) => moves(y) - moves(x) || x.localeCompare(y))) {
    h += `<tr class="row" data-c="${esc(c)}"><td>${esc(label(c))}</td>`;
    for (const lv of LV) {
      const t = TOP[c][lv.id];
      if (!t) { h += '<td class="b np">–</td>'; continue; }
      const moved = lv.id !== NAME && t.a !== TOP[c][NAME].a;
      h += `<td class="b ${moved ? 'moved' : ''}" title="${esc(t.a)} ${pct(t.share)}"><span class="sw" style="background:${color(c, t.a)}"></span>${esc(t.a)}<span class="sh">${pct(t.share)}</span></td>`;
    }
    h += '</tr>';
  }
  main.innerHTML = h + '</table></div>';
  main.querySelectorAll('tr.row').forEach(r => r.addEventListener('click', () => location.hash = '#c/' + r.dataset.c));
}

/* ---------- category: a stacked share bar per level, then each model's answer per level ---------- */
let ONLY_MOVERS = true;
function category(c) {
  if (!L.dist[c]) { main.innerHTML = '<p class="note">Unknown category.</p>'; return; }
  const named = Object.entries(SLOT[c]).sort((a, b) => a[1] - b[1]).map(([a]) => a);
  let h = `<p class="crumb"><a href="#overview">categories</a> / ${esc(label(c))}</p>
  <h2>${esc(label(c))}</h2>
  <p class="note">Share of answers at each level. A brand keeps its color down the ladder; gray is every other brand,
  hatched is a reply that named no brand. Hover a segment for the count.</p>
  <div class="legend">${named.map(a => `<span><i style="background:${color(c, a)}"></i>${esc(a)}</span>`).join('')}
    <span><i style="background:var(--other)"></i>other brands</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--panel2) 0 3px,var(--panel) 3px 6px)"></i>no brand</span></div>`;
  for (const lv of LV) {
    const d = L.dist[c][lv.id], tot = d.reduce((s, [, n]) => s + n, 0);
    const segs = [], other = {n: 0, k: 0}; let np = 0;
    for (const [a, n] of d) { if (a === NP) np = n; else if (SLOT[c][a]) segs.push([a, n]); else { other.n += n; other.k++; } }
    segs.sort((x, y) => SLOT[c][x[0]] - SLOT[c][y[0]]);
    const seg = (cls, style, w, text, t) => `<i class="${cls}" style="${style}flex:${w} 1 0" data-t="${esc(t)}">${w / tot >= .08 ? esc(text) : ''}</i>`;
    let bar = segs.map(([a, n]) => seg('', `background:${color(c, a)};`, n, `${a} ${pct(n / tot)}`, `${a}: ${n} of ${tot} answers (${pct(n / tot)})`)).join('');
    if (other.n) bar += seg('', 'background:var(--other);', other.n, `other ${pct(other.n / tot)}`, `${other.k} other brands: ${other.n} of ${tot} (${pct(other.n / tot)})`);
    if (np) bar += seg('np', '', np, `none ${pct(np / tot)}`, `no brand named: ${np} of ${tot} (${pct(np / tot)})`);
    h += `<div class="lvl"><div class="lab">${esc(lv.label)}<small>${esc(lv.prompt.replace(/soda brand/g, label(c)))}</small></div><div class="bar">${bar}</div></div>`;
  }
  const rows = L.models.map(m => ({m, cells: LV.map(lv => modal(L.per_model[m][c][lv.id]))}))
    .filter(r => r.cells[0]);
  const movers = rows.filter(r => r.cells.some(x => x && x.a !== r.cells[0].a));
  const shown = ONLY_MOVERS ? movers : rows;
  h += `<h3>each model's most frequent answer</h3>
  <p class="note">Gray text is the model's own one-word Name answer; <b>bold</b> is a change from it.</p>
  <div class="ctl"><a class="${ONLY_MOVERS ? 'on' : ''}" href="#" data-mv="1">models that change (${movers.length})</a>
  <a class="${ONLY_MOVERS ? '' : 'on'}" href="#" data-mv="0">all models (${rows.length})</a></div>
  <div class="twrap"><table class="t"><tr><th>model</th>${lvHead(c)}</tr>`;
  for (const r of shown) {
    h += `<tr><td class="mono"><a href="#m/${encodeURIComponent(r.m)}">${esc(r.m)}</a></td>`;
    r.cells.forEach((x, i) => {
      if (!x) { h += '<td class="b np">–</td>'; return; }
      const cls = x.a === NP ? 'np' : (i && x.a !== r.cells[0].a ? 'moved' : 'same');
      h += `<td class="b ${cls}" data-t="${esc(`${x.a}: ${x.n} of ${x.of} runs`)}"><span class="sw" style="background:${x.a === NP ? 'transparent' : color(c, x.a)}"></span>${esc(x.a === NP ? 'no brand' : x.a)}${x.n < x.of ? `<span class="sh">${x.n}/${x.of}</span>` : ''}</td>`;
    });
    h += '</tr>';
  }
  main.innerHTML = h + '</table></div>';
  main.querySelectorAll('[data-mv]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); ONLY_MOVERS = a.dataset.mv === '1'; category(c); }));
  hover('.bar i, td.b[data-t]', el => esc(el.dataset.t));
}

/* ---------- models: how much each model keeps its own default, level by level ---------- */
function retention(m) {
  return LV.map(lv => { let k = 0, n = 0;
    for (const c of L.cats) { const d = L.defaults[m][c], xs = L.per_model[m][c][lv.id];
      if (d && xs.length) { k += xs.filter(x => x === d).length / xs.length; n++; } }
    return n ? k / n : null; });
}
function models() {
  const rows = L.models.map(m => ({m, r: retention(m)})).sort((a, b) => (b.r[LV.length - 1] ?? -1) - (a.r[LV.length - 1] ?? -1));
  let h = `<h2>models</h2>
  <p class="note">How often each model's answer at a level equals its own one-word Name answer, averaged over the
  categories. Sorted by the two-turn pick. Click a model for its answers category by category.</p>
  <div class="twrap"><table class="t"><tr><th>model</th>${lvHead()}</tr>`;
  for (const {m, r} of rows) h += `<tr class="row" data-m="${esc(m)}"><td class="mono">${esc(m)}</td>${r.map(x => `<td class="n">${x == null ? '–' : pct(x)}</td>`).join('')}</tr>`;
  main.innerHTML = h + '</table></div>';
  main.querySelectorAll('tr.row').forEach(r => r.addEventListener('click', () => location.hash = '#m/' + encodeURIComponent(r.dataset.m)));
}
function model(m) {
  if (!L.per_model[m]) { main.innerHTML = '<p class="note">Unknown model.</p>'; return; }
  let h = `<p class="crumb"><a href="#models">models</a> / <span class="mono">${esc(m)}</span></p>
  <h2 class="mono">${esc(m)}</h2>
  <p class="note">This model's most frequent answer per category and level. Gray is its one-word Name answer; <b>bold</b>
  is a change from it. Click a category for the whole field.</p>
  <div class="twrap"><table class="t"><tr><th>category</th>${lvHead()}</tr>`;
  for (const c of L.cats) {
    const cells = LV.map(lv => modal(L.per_model[m][c][lv.id]));
    if (!cells[0]) continue;
    h += `<tr class="row" data-c="${esc(c)}"><td>${esc(label(c))}</td>`;
    cells.forEach((x, i) => {
      if (!x) { h += '<td class="b np">–</td>'; return; }
      const cls = x.a === NP ? 'np' : (i && x.a !== cells[0].a ? 'moved' : 'same');
      h += `<td class="b ${cls}" data-t="${esc(`${x.a}: ${x.n} of ${x.of} runs`)}"><span class="sw" style="background:${x.a === NP ? 'transparent' : color(c, x.a)}"></span>${esc(x.a === NP ? 'no brand' : x.a)}${x.n < x.of ? `<span class="sh">${x.n}/${x.of}</span>` : ''}</td>`;
    });
    h += '</tr>';
  }
  main.innerHTML = h + '</table></div>';
  main.querySelectorAll('tr.row').forEach(r => r.addEventListener('click', () => location.hash = '#c/' + r.dataset.c));
  hover('td.b[data-t]', el => esc(el.dataset.t));
}

/* ---------- method ---------- */
function about() {
  const t = L.two_turn;
  main.innerHTML = `<h2>method</h2>
  <p class="note"><b>Levels.</b> ${LV.map(lv => `<b>${esc(lv.label)}</b>: “${esc(lv.prompt)}”`).join('; ')}.
  Name and Choose are the one-word brand batteries (8 runs); free Name comes from the clamped-versus-free check (4 runs);
  the others are 4 runs. Every model is as served; the 25 hybrid models' reasoning-off runs are kept separately.</p>
  <p class="note"><b>Scoring a free reply.</b> Name and Choose score the whole reply as a brand name. Free Name and Recommend
  take the first brand from the Name and Choose answer pools that the reply mentions. Free Choose and both picks take the
  opening brand: the first bolded label or capitalised name in the first sentence, mapped onto the pool and the alias
  table where possible, since a pick can be a brand no other answer named.</p>
  <p class="note"><b>Two-turn pick.</b> Of ${t.n} replies with a pick, the model's own Name default was in its turn-1 list
  ${pct(t.default_in_list)} of the time and was the pick ${pct(t.default_picked)}; the pick was the first brand listed
  ${pct(t.first_listed)}.</p>
  <p class="note">Source: <code>studies/consensus/brand_ladder.py</code> for the scores and <code>views/build.py --ladder</code>
  for this page.</p>`;
}

/* ---------- router ---------- */
function route() {
  const [v, arg] = (location.hash || '#overview').slice(1).split('/');
  tip.style.display = 'none';
  document.querySelectorAll('nav a[data-v]').forEach(a => a.classList.toggle('on',
    a.dataset.v === v || (v === 'c' && a.dataset.v === 'overview') || (v === 'm' && a.dataset.v === 'models')));
  if (v === 'c' && arg) category(decodeURIComponent(arg));
  else if (v === 'm' && arg) model(decodeURIComponent(arg));
  else if (v === 'models') models();
  else if (v === 'about') about();
  else overview();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
