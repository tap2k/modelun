<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label items</title>
<link rel="stylesheet" href="base.css">
<style>
  main{max-width:880px;margin:0 auto;padding:18px 16px 40px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--mut)}
  .prog{flex:1;min-width:160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .prog span{display:block;height:100%;background:var(--acc)}
  .show{font-size:13px;color:var(--mut);margin:0 0 6px;white-space:pre-wrap} .show b{color:var(--txt)}
  .prompt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;font-weight:600}
  .reply{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0 12px;
    white-space:pre-wrap;font-size:14.5px;line-height:1.5;max-height:52vh;overflow:auto}
  .vals{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .vals button{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
  .vals button .k{color:var(--mut);margin-right:6px;font-size:12px}
  .vals button.sel{background:var(--acc);border-color:var(--acc);color:#0f1115;font-weight:600} .vals button.sel .k{color:#0f1115}
  .pre{font-size:12px;color:var(--mut)}
  textarea{width:100%;box-sizing:border-box;margin-top:10px;font:inherit;font-size:13px;padding:6px 8px;min-height:34px;
    background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px}
  .bar button{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
  .guide{font-size:12.5px;color:var(--mut);margin-top:14px;line-height:1.6;white-space:pre-wrap}
  .err{color:var(--syc)}
  .reply .cite{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:0 4px;white-space:nowrap}
  /* --form: pick-one buttons select, chips toggle, Save writes the card */
  .q{margin:10px 0} .q .ql{font-size:11.5px;color:var(--mut);margin-bottom:5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
  .chips button.sel{background:var(--acc);border-color:var(--acc);color:#0f1115;font-weight:600}
  .chips input{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--txt);width:9em}
  .savebar{display:flex;gap:8px;margin-top:10px} .savebar button{font:inherit;font-size:15px;padding:10px 18px;border-radius:8px;border:0;background:var(--acc);color:#0f1115;font-weight:650;cursor:pointer}
  @media (max-width:640px){
    main{padding:12px 12px 150px}
    .reply{max-height:none;font-size:15px}
    .vals{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
    .vals button{padding:14px 10px;font-size:16px}
    .vals .pre{grid-column:1 / -1;text-align:center}
    .guide{display:none}
    body.form main{padding-bottom:20px}
    body.form .vals{position:static;display:grid;grid-template-columns:repeat(4,1fr);padding:0;border:0;background:none}
    body.form .vals button{padding:13px 4px;font-size:15px}
    body.form .prompt, body.form .vals .k{display:none}
    body.form .savebar{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
    body.form .savebar button{flex:1;padding:14px}
  }
</style>
</head>
<body>
<header><h1>Label items</h1><span class="sub" id="sub"></span></header>
<main>
  <div class="bar"><span id="count"></span><div class="prog"><span id="pbar"></span></div><button onclick="nextOpen()">next unlabeled</button></div>
  <div class="show" id="show"></div>
  <div class="prompt" id="prompt"></div>
  <div class="reply" id="reply"></div>
  <div class="vals" id="vals"></div>
  <div id="form"></div>
  <textarea id="note" placeholder="note (optional, saved with the label)"></textarea>
  <div class="savebar" id="savebar" hidden><button onclick="saveCard()">Save · next</button></div>
  <div class="bar" style="margin-top:10px"><button onclick="go(-1)">← back</button><button onclick="go(1)">forward →</button><span id="pos"></span><span id="msg"></span></div>
  <div class="guide" id="guide"></div>
</main>
<script>
// harness/viewer/label_server.py serves this page: /items.json, /config, /labels, POST /save (Contract B rows)
let ITEMS = [], CFG = {}, DONE = {}, at = 0, shownAt = Date.now();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// replies as written, made readable: a markdown citation "([site](url))" shows as its site name, **bold** as bold
const md = (s) => esc(s).replace(/\(\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)\)/g, '<span class="cite">$1</span>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '$1').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const key = (it) => it.id;   // the server's id for the target, as /labels keys it
// labeled, for this pass: a redo item needs a row at the current criterion version
const done = (it) => { const d = DONE[key(it)]; return !!d && (!it.redo || d.criterion_version === CFG.criterion_version); };

// --form: several questions on one card (label_server.py --form). The first is pick-one and decides whether the item is
// done; pick-any questions show their codes as chips, and an open one takes new codes from the card.
let ANS = {};
const Q1 = () => CFG.questions[0];
const skipped = (q) => Object.entries(q.skip_if || {}).some(([c, vs]) => vs.includes(ANS[c]));
function formShow(){
  const it = ITEMS[at], d = DONE[key(it)], pre = it.pre && typeof it.pre === "object" ? it.pre : {};
  ANS = {};
  for (const q of CFG.questions) ANS[q.criterion] = q.codes ? [...((d && d[q.criterion]) || [])] : (d ? (q === Q1() ? d.value : d[q.criterion]) : pre[q.criterion]) ?? null;
  $("show").innerHTML = Object.entries(it.show || {}).map(([k, v]) => k === "model" ? `<b>${esc(v)}</b>` : esc(v)).join(" · ");
  $("prompt").textContent = it.prompt;
  $("reply").innerHTML = md(it.reply);
  $("note").value = d ? d.note : "";
  formDraw();
  const n = ITEMS.filter(done).length;
  $("count").textContent = `${n} / ${ITEMS.length} labeled`;
  $("pbar").style.width = (100 * n / ITEMS.length) + "%";
  $("pos").textContent = `item ${at + 1} of ${ITEMS.length}${d ? " · saved" : ""}`;
  shownAt = Date.now();
}
function formDraw(){
  const [q1, ...rest] = CFG.questions, name = (q, v) => (q.names || {})[v] || v;
  $("vals").innerHTML = q1.values.map((v, i) => `<button class="${ANS[q1.criterion] === v ? "sel" : ""}" onclick="pick('${q1.criterion}','${v}')"><span class="k">${i + 1}</span>${esc(name(q1, v))}</button>`).join("");
  $("form").innerHTML = rest.map(q => skipped(q)
    ? `<div class="q"><div class="ql">${esc(q.label || q.criterion)}: skipped for this pick</div></div>`
    : `<div class="q"><div class="ql">${esc(q.label || q.criterion)}</div><div class="chips">`
    + (q.codes ? q.codes.map(c => `<button class="${ANS[q.criterion].includes(c) ? "sel" : ""}" onclick="tick('${q.criterion}','${c}')">${esc(name(q, c))}</button>`).join("")
        + (q.open ? `<input id="add-${q.criterion}" placeholder="+ code" onkeydown="if(event.key==='Enter'){event.preventDefault();addCode('${q.criterion}',this.value)}">`
            + `<button onclick="addCode('${q.criterion}',$('add-${q.criterion}').value)">add</button>` : "")
      : q.values.map(v => `<button class="${ANS[q.criterion] === v ? "sel" : ""}" onclick="pick('${q.criterion}','${v}')">${esc(name(q, v))}</button>`).join(""))
    + `</div></div>`).join("");
}
function pick(c, v){ ANS[c] = v; formDraw(); }
function tick(c, code){ const a = ANS[c]; a.includes(code) ? a.splice(a.indexOf(code), 1) : a.push(code); formDraw(); }
async function addCode(c, code){
  const r = await (await fetch("/add_code", {method: "POST", body: JSON.stringify({question: c, code})})).json();
  if (r.error) { $("msg").innerHTML = `<span class="err">${esc(r.error)}</span>`; return; }
  CFG.questions.find(q => q.criterion === c).codes = r.codes;
  if (!ANS[c].includes(r.code)) ANS[c].push(r.code);
  formDraw();
}
async function saveCard(){
  const it = ITEMS[at], q1 = Q1(), note = $("note").value;
  if (!ANS[q1.criterion]) { $("msg").innerHTML = `<span class="err">pick ${esc(q1.label || q1.criterion)} first</span>`; return; }
  const answers = Object.fromEntries(CFG.questions.filter(q => !skipped(q)).map(q => [q.criterion, ANS[q.criterion]]));
  const r = await fetch("/save", {method: "POST", body: JSON.stringify({id: it.id, answers, note,
    ts: new Date().toISOString(), secs: Math.round((Date.now() - shownAt) / 1000)})});
  if (!r.ok) { $("msg").innerHTML = `<span class="err">save failed: ${esc((await r.json()).error)}</span>`; return; }
  $("msg").textContent = "";
  DONE[key(it)] = {value: ANS[q1.criterion], note, criterion_version: q1.version,
    ...Object.fromEntries(CFG.questions.slice(1).map(q => [q.criterion, ANS[q.criterion]]))};
  go(1);
}
function show(){
  if (CFG.form) return formShow();
  const it = ITEMS[at], d = DONE[key(it)], cur = d ? d.value : it.pre;   // a redo shows its old label selected
  $("show").innerHTML = Object.entries(it.show || {}).map(([k, v]) => k === "model" ? `<b>${esc(v)}</b>` : esc(v)).join(" · ");
  $("prompt").textContent = it.prompt;
  $("reply").innerHTML = md(it.reply);
  $("note").value = d ? d.note : "";
  $("vals").innerHTML = CFG.values.map((v, i) => `<button class="${v === cur ? "sel" : ""}" onclick="save('${v}')"><span class="k">${i + 1}</span>${esc(v)}</button>`).join("")
    + (it.pre && !d ? `<span class="pre">pre-label: ${esc(it.pre)} (Enter to accept)</span>` : "");
  const n = ITEMS.filter(done).length;
  $("count").textContent = `${n} / ${ITEMS.length} labeled`;
  $("pbar").style.width = (100 * n / ITEMS.length) + "%";
  $("pos").textContent = `item ${at + 1} of ${ITEMS.length}${d ? " · " + d.value : ""}${it.redo && !done(it) ? " · relabel" : ""}`;
  shownAt = Date.now();
}
async function save(v){
  const it = ITEMS[at], note = $("note").value;
  const r = await fetch("/save", {method: "POST", body: JSON.stringify({id: it.id, value: v, note,
    ts: new Date().toISOString(), secs: Math.round((Date.now() - shownAt) / 1000)})});
  if (!r.ok) { $("msg").innerHTML = `<span class="err">save failed: ${esc((await r.json()).error)}</span>`; return; }
  $("msg").textContent = ""; DONE[key(it)] = {value: v, note, criterion_version: CFG.criterion_version}; go(1);
}
function go(d){ at = Math.min(ITEMS.length - 1, Math.max(0, at + d)); show(); }
function nextOpen(){
  const i = ITEMS.findIndex((it, j) => j > at && !done(it));
  const k = i >= 0 ? i : ITEMS.findIndex(it => !done(it));
  if (k >= 0) { at = k; show(); }
}
addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (CFG.form) {
    const q1 = Q1();
    if (n >= 1 && n <= q1.values.length) pick(q1.criterion, q1.values[n - 1]);
    else if (e.key === "Enter") saveCard();
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    return;
  }
  if (n >= 1 && n <= CFG.values.length) save(CFG.values[n - 1]);
  else if (e.key === "Enter") { const it = ITEMS[at], d = DONE[key(it)]; const v = d ? d.value : it.pre; if (v) save(v); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
(async () => {
  [ITEMS, CFG, DONE] = await Promise.all(["/items.json", "/config", "/labels"].map(async u => (await fetch(u)).json()));
  $("sub").textContent = `${CFG.labeler} · ${CFG.questions.map(q => q.criterion).join(", ")}${CFG.blind.length ? " · hidden: " + CFG.blind.join(", ") : ""}`;
  if (CFG.form) { document.body.classList.add("form"); $("savebar").hidden = false; }
  $("guide").textContent = CFG.guide;
  at = Math.max(0, ITEMS.findIndex(it => !done(it)));
  show();
})();
</script>
</body>
</html>
